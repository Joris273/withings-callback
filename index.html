<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Withings-Weiterleitung</title>
<style>
  :root { --text: #1b1f24; --matt: #5b6470; --flaeche: #f6f7f9; --rand: #d5d9df; --fehler: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e6e9ee; --matt: #a3acb9; --flaeche: #15181d; --rand: #2c323b; --fehler: #ff8a80; }
  }
  body { margin: 0; padding: 32px 16px; background: var(--flaeche); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: var(--matt); }
  code { display: block; padding: 8px 12px; border: 1px solid var(--rand); border-radius: 6px;
         word-break: break-all; color: var(--text); }
  .fehler { color: var(--fehler); }
</style>
</head>
<body>
<main>
  <h1 id="titel">Weiterleitung zum Nano-Admin-Tool …</h1>
  <p id="text">Einen Moment – die Freigabe wird an das Tool auf deinem Rechner übergeben.</p>
  <code id="adresse" hidden></code>
</main>
<script>
// Diese Seite ist die bei Withings eingetragene Callback-URL. Withings erlaubt
// dort weder localhost noch IP-Adressen. Sie reicht nur code und state an den
// kurzlebigen Empfänger des Nano-Admin-Tools weiter und speichert nichts.
(function () {
  var PORT = 8765;
  var q = new URLSearchParams(window.location.search);
  var titel = document.getElementById("titel");
  var text = document.getElementById("text");
  var adresse = document.getElementById("adresse");

  if (q.get("error")) {
    titel.textContent = "Withings hat die Freigabe nicht erteilt";
    titel.className = "fehler";
    text.textContent = "Meldung von Withings: " + q.get("error") + ". Im Tool erneut „Withings verbinden“ wählen.";
    return;
  }
  if (!q.get("code")) {
    titel.textContent = "Withings-Weiterleitung";
    text.textContent = "Diese Seite wird nur während der Verbindung mit Withings gebraucht.";
    return;
  }

  // 127.0.0.1 statt localhost: localhost löst unter Windows oft zuerst auf ::1 auf.
  var ziel = "http://127.0.0.1:" + PORT + "/callback?" + new URLSearchParams({
    code: q.get("code"),
    state: q.get("state") || ""
  }).toString();

  // Falls die Weiterleitung scheitert (Tool nicht offen), bleibt die Adresse
  // zum Kopieren stehen. Der Code gilt nur etwa 30 Sekunden.
  setTimeout(function () {
    titel.textContent = "Das Tool hat die Freigabe nicht angenommen";
    text.textContent = "Ist das Nano-Admin-Tool geöffnet und wartet es auf Withings? Sonst diese Adresse sofort in das Feld im Dialog einfügen:";
    adresse.textContent = window.location.href;
    adresse.hidden = false;
  }, 4000);

  window.location.replace(ziel);
})();
</script>
</body>
</html>
